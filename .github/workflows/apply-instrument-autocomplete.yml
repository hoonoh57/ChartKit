name: Apply instrument autocomplete implementation

on:
  push:
    branches:
      - csharp/runtime-symbol-entry
    paths:
      - '.github/workflows/apply-instrument-autocomplete.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: csharp/runtime-symbol-entry
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply implementation
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def write(path: str, content: str) -> None:
              file = Path(path)
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          write(
              "csharp_chartkit/src/ChartKit.Contracts/InstrumentSearchContracts.cs",
              r'''namespace ChartKit.CSharp.Contracts;

public sealed record InstrumentSearchResult(
    string Symbol,
    string DisplayName,
    string Market,
    bool NxtEnabled);

public interface IInstrumentSearchSource
{
    Task<IReadOnlyList<InstrumentSearchResult>> SearchInstrumentsAsync(
        string query,
        int limit = 20,
        CancellationToken cancellationToken = default);
}
''')

          write(
              "csharp_chartkit/src/ChartKit.DataSources/KiwoomRestDataSource.InstrumentSearch.cs",
              r'''using System.Text;
using System.Text.Json;
using ChartKit.CSharp.Contracts;

namespace ChartKit.CSharp.DataSources;

public sealed partial class KiwoomRestDataSource
{
    private static readonly InstrumentMarket[] InstrumentMarkets =
    [
        new("0", "KOSPI", true),
        new("10", "KOSDAQ", true),
        new("8", "ETF", false)
    ];

    private readonly SemaphoreSlim _instrumentCatalogGate = new(1, 1);
    private InstrumentSearchResult[]? _instrumentCatalog;

    public async Task<IReadOnlyList<InstrumentSearchResult>> SearchInstrumentsAsync(
        string query,
        int limit = 20,
        CancellationToken cancellationToken = default)
    {
        ThrowIfDisposed();
        int requestedLimit = Math.Clamp(limit, 1, 100);
        InstrumentSearchResult[] catalog =
            await EnsureInstrumentCatalogAsync(cancellationToken).ConfigureAwait(false);

        string normalizedQuery = NormalizeInstrumentSearchText(query);
        if (normalizedQuery.Length == 0)
            return Array.Empty<InstrumentSearchResult>();

        return catalog
            .Select(item => new RankedInstrument(item, Score(item, normalizedQuery)))
            .Where(static item => item.Score < int.MaxValue)
            .OrderBy(static item => item.Score)
            .ThenBy(static item => item.Value.DisplayName, StringComparer.Ordinal)
            .ThenBy(static item => item.Value.Symbol, StringComparer.Ordinal)
            .Take(requestedLimit)
            .Select(static item => item.Value)
            .ToArray();
    }

    private async Task<InstrumentSearchResult[]> EnsureInstrumentCatalogAsync(
        CancellationToken cancellationToken)
    {
        InstrumentSearchResult[]? cached = Volatile.Read(ref _instrumentCatalog);
        if (cached is not null) return cached;

        await _instrumentCatalogGate.WaitAsync(cancellationToken).ConfigureAwait(false);
        try
        {
            cached = _instrumentCatalog;
            if (cached is not null) return cached;

            var bySymbol = new Dictionary<string, InstrumentSearchResult>(
                StringComparer.Ordinal);
            List<Exception>? optionalFailures = null;

            foreach (InstrumentMarket market in InstrumentMarkets)
            {
                try
                {
                    await AppendMarketAsync(
                            market,
                            bySymbol,
                            cancellationToken)
                        .ConfigureAwait(false);
                }
                catch (Exception exception) when (!market.Required)
                {
                    optionalFailures ??= [];
                    optionalFailures.Add(exception);
                }
            }

            if (bySymbol.Count == 0)
            {
                if (optionalFailures is { Count: > 0 })
                    throw new AggregateException(
                        "Kiwoom instrument catalog was empty.",
                        optionalFailures);
                throw new InvalidOperationException(
                    "Kiwoom instrument catalog was empty.");
            }

            cached = bySymbol.Values
                .OrderBy(static item => item.DisplayName, StringComparer.Ordinal)
                .ThenBy(static item => item.Symbol, StringComparer.Ordinal)
                .ToArray();
            Volatile.Write(ref _instrumentCatalog, cached);
            return cached;
        }
        finally
        {
            _instrumentCatalogGate.Release();
        }
    }

    private async Task AppendMarketAsync(
        InstrumentMarket market,
        Dictionary<string, InstrumentSearchResult> destination,
        CancellationToken cancellationToken)
    {
        string body = JsonSerializer.Serialize(new Dictionary<string, string>
        {
            ["mrkt_tp"] = market.Code
        });
        string continuation = "N";
        string nextKey = string.Empty;

        for (int page = 0; page < 20; page++)
        {
            string requestedKey = nextKey;
            using KiwoomJsonResponse response = await _session.PostJsonAsync(
                    "/api/dostk/stkinfo",
                    "ka10099",
                    body,
                    continuation,
                    nextKey,
                    cancellationToken)
                .ConfigureAwait(false);

            JsonElement root = response.Document.RootElement;
            int returnCode = KiwoomJson.ReadInt(root, "return_code");
            if (returnCode != 0)
            {
                throw new InvalidOperationException(
                    $"Kiwoom ka10099 failed for market {market.Code}: " +
                    KiwoomJson.Text(root, "return_msg"));
            }

            var rows = new List<JsonElement>();
            if (root.TryGetProperty("list", out JsonElement list) &&
                list.ValueKind == JsonValueKind.Array)
            {
                foreach (JsonElement row in list.EnumerateArray())
                {
                    if (row.ValueKind == JsonValueKind.Object)
                        rows.Add(row);
                }
            }
            else
            {
                KiwoomJson.AppendFirstObjectArray(root, rows);
            }

            foreach (JsonElement row in rows)
            {
                string symbol = NormalizeCatalogSymbol(
                    KiwoomJson.Text(row, "code", "stk_cd", "stock_code"));
                string displayName = KiwoomJson.Text(
                        row,
                        "name",
                        "stk_nm",
                        "stock_name")
                    .Trim();
                if (!IsSixDigitKrxSymbol(symbol) || displayName.Length == 0)
                    continue;

                string resolvedMarket = KiwoomJson.Text(
                        row,
                        "marketName",
                        "market_name",
                        "mrkt_nm")
                    .Trim();
                if (resolvedMarket.Length == 0) resolvedMarket = market.Name;
                bool nxtEnabled = string.Equals(
                    KiwoomJson.Text(
                        row,
                        "nxtEnable",
                        "nxt_enable",
                        "nxt_yn"),
                    "Y",
                    StringComparison.OrdinalIgnoreCase);

                var candidate = new InstrumentSearchResult(
                    symbol,
                    displayName,
                    resolvedMarket,
                    nxtEnabled);
                if (!destination.TryGetValue(symbol, out InstrumentSearchResult? current) ||
                    IsPreferred(candidate, current))
                {
                    destination[symbol] = candidate;
                }
            }

            continuation = response.Continuation.Trim().ToUpperInvariant();
            nextKey = response.NextKey.Trim();
            if (continuation != "Y" ||
                nextKey.Length == 0 ||
                string.Equals(nextKey, requestedKey, StringComparison.Ordinal))
                break;
        }
    }

    private static bool IsPreferred(
        InstrumentSearchResult candidate,
        InstrumentSearchResult current) =>
        !string.Equals(candidate.Market, "ETF", StringComparison.OrdinalIgnoreCase) &&
        string.Equals(current.Market, "ETF", StringComparison.OrdinalIgnoreCase);

    private static int Score(
        InstrumentSearchResult item,
        string normalizedQuery)
    {
        string symbol = NormalizeInstrumentSearchText(item.Symbol);
        string name = NormalizeInstrumentSearchText(item.DisplayName);
        if (string.Equals(symbol, normalizedQuery, StringComparison.Ordinal)) return 0;
        if (symbol.StartsWith(normalizedQuery, StringComparison.Ordinal)) return 1;
        if (string.Equals(name, normalizedQuery, StringComparison.Ordinal)) return 2;
        if (name.StartsWith(normalizedQuery, StringComparison.Ordinal)) return 3;
        return name.Contains(normalizedQuery, StringComparison.Ordinal)
            ? 4
            : int.MaxValue;
    }

    private static string NormalizeInstrumentSearchText(string? value)
    {
        if (string.IsNullOrWhiteSpace(value)) return string.Empty;
        var builder = new StringBuilder(value.Length);
        foreach (char character in value.Trim())
        {
            if (char.IsLetterOrDigit(character))
                builder.Append(char.ToUpperInvariant(character));
        }
        return builder.ToString();
    }

    private static string NormalizeCatalogSymbol(string value)
    {
        string symbol = value.Trim().ToUpperInvariant();
        if (symbol.Length == 7 && symbol[0] == 'A' &&
            symbol.AsSpan(1).ToString().All(char.IsDigit))
            symbol = symbol[1..];
        int suffix = symbol.IndexOf('_');
        return suffix > 0 ? symbol[..suffix] : symbol;
    }

    private static bool IsSixDigitKrxSymbol(string value) =>
        value.Length == 6 && value.All(char.IsDigit);

    private readonly record struct InstrumentMarket(
        string Code,
        string Name,
        bool Required);

    private readonly record struct RankedInstrument(
        InstrumentSearchResult Value,
        int Score);
}
''')

          write(
              "csharp_chartkit/src/ChartKit.App/MainForm.InstrumentSearch.cs",
              r'''using ChartKit.CSharp.Contracts;

namespace ChartKit.CSharp.App;

internal sealed partial class MainForm
{
    private const int InstrumentSearchLimit = 20;
    private const int InstrumentSearchDebounceMilliseconds = 120;

    private readonly ToolStripDropDown _instrumentSearchDropDown = new()
    {
        AutoClose = false,
        Padding = Padding.Empty
    };
    private readonly ListBox _instrumentSearchList = new()
    {
        BorderStyle = BorderStyle.FixedSingle,
        IntegralHeight = false,
        ItemHeight = 24
    };
    private ToolStripControlHost? _instrumentSearchHost;
    private CancellationTokenSource? _instrumentSearchStop;
    private long _instrumentSearchGeneration;
    private bool _applyingInstrumentChoice;
    private bool _instrumentSearchDisposed;

    private void ConfigureInstrumentSearch()
    {
        if (_instrumentSearchHost is not null) return;

        _instrumentSearchList.Font = new Font(
            Font.FontFamily,
            Math.Max(9f, Font.Size),
            FontStyle.Regular);
        _instrumentSearchList.MouseClick += async (_, e) =>
        {
            if (e.Button != MouseButtons.Left ||
                _instrumentSearchList.SelectedItem is not InstrumentChoice choice)
                return;
            await ExecuteDataCommandAsync(
                () => CommitInstrumentChoiceAsync(choice.Value));
        };

        _instrumentSearchHost = new ToolStripControlHost(_instrumentSearchList)
        {
            AutoSize = false,
            Margin = Padding.Empty,
            Padding = Padding.Empty,
            Size = new Size(420, 288)
        };
        _instrumentSearchDropDown.Items.Add(_instrumentSearchHost);
        _dataSymbolEditor.TextChanged += OnInstrumentSearchTextChanged;
    }

    private void OnInstrumentSearchTextChanged(object? sender, EventArgs e)
    {
        if (_updatingDataControls ||
            _applyingInstrumentChoice ||
            _instrumentSearchDisposed)
            return;

        string query = _dataSymbolEditor.Text.Trim();
        if (query.Length == 0)
        {
            CloseInstrumentSearchDropDown();
            CancelInstrumentSearch();
            return;
        }

        QueueInstrumentSearch(query);
    }

    private void QueueInstrumentSearch(string query)
    {
        CancellationTokenSource next =
            CancellationTokenSource.CreateLinkedTokenSource(_stop.Token);
        CancellationTokenSource? previous = _instrumentSearchStop;
        _instrumentSearchStop = next;
        previous?.Cancel();
        long generation = ++_instrumentSearchGeneration;
        _ = RunInstrumentSearchAsync(query, generation, next);
    }

    private async Task RunInstrumentSearchAsync(
        string query,
        long generation,
        CancellationTokenSource request)
    {
        try
        {
            await Task.Delay(
                InstrumentSearchDebounceMilliseconds,
                request.Token);
            if (_source is not IInstrumentSearchSource searchSource)
            {
                CloseInstrumentSearchDropDown();
                return;
            }

            IReadOnlyList<InstrumentSearchResult> results =
                await searchSource.SearchInstrumentsAsync(
                    query,
                    InstrumentSearchLimit,
                    request.Token);
            if (request.IsCancellationRequested ||
                generation != _instrumentSearchGeneration ||
                IsDisposed)
                return;

            ApplyInstrumentSuggestions(query, results);
        }
        catch (OperationCanceledException) when (request.IsCancellationRequested)
        {
        }
        catch (Exception exception)
        {
            if (!IsDisposed && generation == _instrumentSearchGeneration)
            {
                CloseInstrumentSearchDropDown();
                _statusLabel.Text = "종목검색 오류: " + exception.Message;
            }
        }
        finally
        {
            if (ReferenceEquals(_instrumentSearchStop, request))
                _instrumentSearchStop = null;
            request.Dispose();
        }
    }

    private void ApplyInstrumentSuggestions(
        string query,
        IReadOnlyList<InstrumentSearchResult> results)
    {
        if (!_dataSymbolEditor.TextBox.Focused ||
            !string.Equals(
                NormalizeSearchQuery(_dataSymbolEditor.Text),
                NormalizeSearchQuery(query),
                StringComparison.Ordinal))
            return;

        _instrumentSearchList.BeginUpdate();
        try
        {
            _instrumentSearchList.Items.Clear();
            foreach (InstrumentSearchResult result in results)
                _instrumentSearchList.Items.Add(new InstrumentChoice(result));
            if (_instrumentSearchList.Items.Count > 0)
                _instrumentSearchList.SelectedIndex = 0;
        }
        finally
        {
            _instrumentSearchList.EndUpdate();
        }

        if (_instrumentSearchList.Items.Count == 0)
        {
            CloseInstrumentSearchDropDown();
            _statusLabel.Text = $"종목검색 결과 없음: {query}";
            return;
        }

        ShowInstrumentSearchDropDown();
        _statusLabel.Text =
            $"종목검색 {results.Count:N0}건 | 방향키로 이동 후 Enter";
    }

    private void ShowInstrumentSearchDropDown()
    {
        if (_instrumentSearchDisposed ||
            _instrumentSearchDropDown.Visible ||
            !_dataSymbolEditor.TextBox.IsHandleCreated)
            return;

        Point location = _dataSymbolEditor.TextBox.PointToScreen(
            new Point(0, _dataSymbolEditor.TextBox.Height));
        _instrumentSearchDropDown.Show(location);
        _dataSymbolEditor.TextBox.Focus();
    }

    private async Task HandleInstrumentSearchKeyDownAsync(KeyEventArgs e)
    {
        switch (e.KeyCode)
        {
            case Keys.Down when _instrumentSearchDropDown.Visible:
                e.SuppressKeyPress = true;
                MoveInstrumentSelection(1);
                return;

            case Keys.Up when _instrumentSearchDropDown.Visible:
                e.SuppressKeyPress = true;
                MoveInstrumentSelection(-1);
                return;

            case Keys.Escape when _instrumentSearchDropDown.Visible:
                e.SuppressKeyPress = true;
                CloseInstrumentSearchDropDown();
                return;

            case Keys.Enter:
                e.SuppressKeyPress = true;
                InstrumentSearchResult? selected = ResolveSelectedInstrument();
                if (selected is not null)
                {
                    await ExecuteDataCommandAsync(
                        () => CommitInstrumentChoiceAsync(selected));
                    return;
                }

                string text = _dataSymbolEditor.Text.Trim();
                if (_source is not IInstrumentSearchSource ||
                    IsDirectSymbolText(text))
                {
                    await ExecuteDataCommandAsync(
                        () => CommitSymbolAsync(text));
                    return;
                }

                _statusLabel.Text = "검색 목록에서 종목을 선택하십시오.";
                QueueInstrumentSearch(text);
                return;
        }
    }

    private InstrumentSearchResult? ResolveSelectedInstrument()
    {
        string query = NormalizeSearchQuery(_dataSymbolEditor.Text);
        InstrumentSearchResult? exact = null;
        foreach (object item in _instrumentSearchList.Items)
        {
            if (item is not InstrumentChoice choice) continue;
            string symbol = NormalizeSearchQuery(choice.Value.Symbol);
            string name = NormalizeSearchQuery(choice.Value.DisplayName);
            if (string.Equals(query, symbol, StringComparison.Ordinal) ||
                string.Equals(query, name, StringComparison.Ordinal))
                return choice.Value;
            exact ??= choice.Value;
        }

        if (_instrumentSearchDropDown.Visible &&
            _instrumentSearchList.SelectedItem is InstrumentChoice selected)
            return selected.Value;
        return _instrumentSearchList.Items.Count == 1 ? exact : null;
    }

    private void MoveInstrumentSelection(int delta)
    {
        int count = _instrumentSearchList.Items.Count;
        if (count == 0) return;
        int current = Math.Max(0, _instrumentSearchList.SelectedIndex);
        _instrumentSearchList.SelectedIndex =
            Math.Clamp(current + delta, 0, count - 1);
        _instrumentSearchList.TopIndex =
            Math.Max(0, _instrumentSearchList.SelectedIndex - 4);
    }

    private async Task CommitInstrumentChoiceAsync(
        InstrumentSearchResult choice)
    {
        CloseInstrumentSearchDropDown();
        CancelInstrumentSearch();
        _applyingInstrumentChoice = true;
        try
        {
            _dataSymbolEditor.Text = choice.Symbol;
        }
        finally
        {
            _applyingInstrumentChoice = false;
        }

        _metadataCache[choice.Symbol] = new InstrumentMetadata(
            choice.Symbol,
            choice.DisplayName,
            choice.Market,
            _source.Name,
            DateTimeOffset.UtcNow);
        await CommitSymbolAsync(choice.Symbol);
    }

    private void StartInstrumentSearchWarmup()
    {
        if (_source is not IInstrumentSearchSource searchSource) return;
        _ = WarmInstrumentSearchAsync(searchSource);
    }

    private async Task WarmInstrumentSearchAsync(
        IInstrumentSearchSource searchSource)
    {
        try
        {
            await searchSource.SearchInstrumentsAsync(
                string.Empty,
                1,
                _stop.Token);
        }
        catch (OperationCanceledException) when (_stop.IsCancellationRequested)
        {
        }
        catch (Exception exception)
        {
            if (!IsDisposed)
                _statusLabel.Text = "종목검색 준비 실패: " + exception.Message;
        }
    }

    private void CancelInstrumentSearch()
    {
        CancellationTokenSource? request = _instrumentSearchStop;
        _instrumentSearchStop = null;
        request?.Cancel();
    }

    private void CloseInstrumentSearchDropDown()
    {
        if (_instrumentSearchDropDown.Visible)
            _instrumentSearchDropDown.Close(ToolStripDropDownCloseReason.CloseCalled);
    }

    private void DisposeInstrumentSearch()
    {
        if (_instrumentSearchDisposed) return;
        _instrumentSearchDisposed = true;
        CancelInstrumentSearch();
        CloseInstrumentSearchDropDown();
        _instrumentSearchDropDown.Dispose();
    }

    private static bool IsDirectSymbolText(string value) =>
        value.Length is > 0 and <= 24 &&
        value.All(character =>
            char.IsAsciiLetterOrDigit(character) || character == '_');

    private static string NormalizeSearchQuery(string value) =>
        new(value
            .Where(char.IsLetterOrDigit)
            .Select(char.ToUpperInvariant)
            .ToArray());

    private sealed record InstrumentChoice(InstrumentSearchResult Value)
    {
        public override string ToString() =>
            $"{Value.DisplayName,-20} [{Value.Symbol}]  {Value.Market}" +
            (Value.NxtEnabled ? "  NXT" : string.Empty);
    }
}
''')

          write(
              "csharp_chartkit/tests/ChartKit.EngineVerification/InstrumentSearchVerification.cs",
              r'''using System.Net;
using ChartKit.CSharp.Contracts;
using ChartKit.CSharp.DataSources;

namespace ChartKit.CSharp.EngineVerification;

internal static class InstrumentSearchVerification
{
    public static async Task RunAsync()
    {
        var handler = new ScriptedHttpHandler((_, call) => call switch
        {
            1 => ScriptedHttpHandler.Json(
                HttpStatusCode.OK,
                "{\"token\":\"instrument-token\",\"expires_in\":3600}"),
            2 => ScriptedHttpHandler.Json(
                HttpStatusCode.OK,
                "{\"list\":[" +
                "{\"code\":\"005930\",\"name\":\"삼성전자\",\"nxtEnable\":\"Y\"}," +
                "{\"code\":\"000660\",\"name\":\"SK하이닉스\",\"nxtEnable\":\"Y\"}" +
                "],\"return_code\":0}"),
            3 => ScriptedHttpHandler.Json(
                HttpStatusCode.OK,
                "{\"list\":[" +
                "{\"code\":\"006400\",\"name\":\"삼성SDI\",\"nxtEnable\":\"Y\"}," +
                "{\"code\":\"035720\",\"name\":\"카카오\",\"nxtEnable\":\"Y\"}" +
                "],\"return_code\":0}"),
            4 => ScriptedHttpHandler.Json(
                HttpStatusCode.OK,
                "{\"list\":[" +
                "{\"code\":\"069500\",\"name\":\"KODEX 200\",\"nxtEnable\":\"N\"}" +
                "],\"return_code\":0}"),
            _ => throw new InvalidOperationException(
                $"Unexpected instrument search HTTP call {call}.")
        });
        var options = new KiwoomOptions(
            IsMock: false,
            AppKey: "app",
            SecretKey: "secret",
            RestBaseUri: new Uri("https://api.test"),
            WebSocketUri: new Uri("wss://socket.test"),
            AdjustPrice: "1",
            DefaultSymbol: "005930",
            RequestInterval: TimeSpan.Zero,
            RequestTimeout: TimeSpan.FromSeconds(5));

        await using var session = new KiwoomApiSession(options, handler);
        await using var source = new KiwoomRestDataSource(options, session);

        IReadOnlyList<InstrumentSearchResult> samsung =
            await source.SearchInstrumentsAsync("삼성", 10);
        Require(
            samsung.Select(static item => item.Symbol)
                .OrderBy(static item => item, StringComparer.Ordinal)
                .SequenceEqual(["005930", "006400"]),
            "Korean partial-name search failed.");

        IReadOnlyList<InstrumentSearchResult> exactName =
            await source.SearchInstrumentsAsync("삼성 전자", 10);
        Require(
            exactName.Count > 0 && exactName[0].Symbol == "005930",
            "Whitespace-normalized exact-name ranking failed.");

        IReadOnlyList<InstrumentSearchResult> exactCode =
            await source.SearchInstrumentsAsync("005930", 10);
        Require(
            exactCode.Count > 0 &&
            exactCode[0].DisplayName == "삼성전자" &&
            exactCode[0].NxtEnabled,
            "Exact-code search failed.");

        IReadOnlyList<InstrumentSearchResult> etf =
            await source.SearchInstrumentsAsync("KODEX", 10);
        Require(
            etf.Count == 1 && etf[0].Symbol == "069500",
            "ETF name search failed.");

        _ = await source.SearchInstrumentsAsync("카카오", 10);
        Require(
            handler.Calls.Count == 4,
            "Instrument catalog must be loaded once and reused from memory.");
        Require(
            handler.Calls.Skip(1).All(static call =>
                call.Path == "/api/dostk/stkinfo" &&
                call.ApiId == "ka10099"),
            "Instrument search used an unexpected Kiwoom endpoint.");

        Console.WriteLine("kiwoom_instrument_search_name=PASS");
        Console.WriteLine("kiwoom_instrument_search_code=PASS");
        Console.WriteLine("kiwoom_instrument_search_cache=PASS");
    }

    private static void Require(bool condition, string message)
    {
        if (!condition) throw new InvalidOperationException(message);
    }
}
''')

