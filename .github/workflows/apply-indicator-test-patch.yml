name: Apply Indicator Identity Test Correction

on:
  push:
    branches:
      - improve/chart-engine-hardening
    paths:
      - .github/workflows/apply-indicator-test-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout improvement branch
        uses: actions/checkout@v4
        with:
          ref: improve/chart-engine-hardening
          fetch-depth: 0

      - name: Correct dictionary update test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'Tests/IndicatorIdentityVerification/Program.vb'
          $content = [System.IO.File]::ReadAllText($path)
          $old = @'
            Dim changed As New Dictionary(Of String, Object)(registered.Parameters) From {
                {"Phase", -50}
            }
'@
          $new = @'
            Dim changed As New Dictionary(Of String, Object)(registered.Parameters)
            changed("Phase") = -50
'@
          if (-not $content.Contains($old)) {
            throw 'Expected duplicate-key test block was not found.'
          }
          $content = $content.Replace($old, $new)
          [System.IO.File]::WriteAllText(
            $path,
            $content,
            [System.Text.UTF8Encoding]::new($true))
          Remove-Item '.github/workflows/apply-indicator-test-patch.yml' -Force

      - name: Commit correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Correct indicator parameter edit verification'
          git push origin HEAD:improve/chart-engine-hardening
