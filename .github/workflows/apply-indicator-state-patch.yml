name: Apply Indicator State Compatibility Patch

on:
  push:
    branches:
      - improve/chart-engine-hardening
    paths:
      - .github/workflows/apply-indicator-state-patch.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout improvement branch
        uses: actions/checkout@v4
        with:
          ref: improve/chart-engine-hardening
          fetch-depth: 0

      - name: Apply state compatibility patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'Core/ChartControl/ChartControl.State.vb'
          $content = [System.IO.File]::ReadAllText($path)
          $old = '.TypeName = ind.GetType().AssemblyQualifiedName,'
          $new = '.TypeName = IndicatorIdentity.SourceTypeName(ind),'
          if (-not $content.Contains($old)) {
            throw "Expected state type line was not found."
          }
          $content = $content.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($true))

          Remove-Item '.github/workflows/indicator-inventory.yml' -Force
          Remove-Item '.github/workflows/apply-indicator-state-patch.yml' -Force

      - name: Commit verified patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Preserve source indicator type in saved state'
          git push origin HEAD:improve/chart-engine-hardening
