name: Apply Kiwoom Session Integration

on:
  push:
    branches:
      - improve/chart-engine-hardening
    paths:
      - .github/workflows/apply-kiwoom-session.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout improvement branch
        uses: actions/checkout@v4
        with:
          ref: improve/chart-engine-hardening
          fetch-depth: 0

      - name: Apply source patch
        shell: pwsh
        run: .\.github\scripts\apply-kiwoom-session.ps1

      - name: Commit patched sources
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- DataSources/KiwoomApiSession.vb DataSources/KiwoomRestSource.vb
          if (git diff --cached --quiet) {
            throw 'Kiwoom session patch produced no changes.'
          }
          git commit -m "Centralize Kiwoom token and throttle"
          git push origin HEAD:improve/chart-engine-hardening
