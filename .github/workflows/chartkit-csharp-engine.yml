name: ChartKit CSharp Engine

on:
  pull_request:
    branches:
      - improve/chart-engine-hardening
    paths:
      - 'csharp_chartkit/**'
      - '.github/workflows/chartkit-csharp-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore CSharp verification
        run: dotnet restore .\csharp_chartkit\tests\ChartKit.EngineVerification\ChartKit.EngineVerification.csproj
      - name: Build CSharp verification
        run: dotnet build .\csharp_chartkit\tests\ChartKit.EngineVerification\ChartKit.EngineVerification.csproj -c Release --no-restore
      - name: Run CSharp verification
        run: dotnet run --project .\csharp_chartkit\tests\ChartKit.EngineVerification\ChartKit.EngineVerification.csproj -c Release --no-build
      - name: Restore CSharp application
        run: dotnet restore .\csharp_chartkit\src\ChartKit.App\ChartKit.App.csproj
      - name: Build CSharp application
        run: dotnet build .\csharp_chartkit\src\ChartKit.App\ChartKit.App.csproj -c Release --no-restore
      - name: Run CSharp application self-test
        run: dotnet run --project .\csharp_chartkit\src\ChartKit.App\ChartKit.App.csproj -c Release --no-build -- --self-test --count 120
