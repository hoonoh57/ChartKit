name: Diagnose Kiwoom Structure

on:
  push:
    branches:
      - improve/chart-engine-hardening

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List repository files
        shell: pwsh
        run: |
          Write-Host "===FILES==="
          Get-ChildItem -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\(bin|obj|\.git)\\' } |
            ForEach-Object { $_.FullName.Substring($PWD.Path.Length + 1) }

      - name: Search Kiwoom and HTTP references
        shell: pwsh
        run: |
          Write-Host "===MATCHES==="
          $patterns = @('Kiwoom','HttpClient','Authorization','access_token','token','429','TooManyRequests','SemaphoreSlim','Task.Delay','rate','throttle')
          Get-ChildItem -Recurse -File -Include *.vb,*.json,*.md,*.yml,*.yaml |
            Where-Object { $_.FullName -notmatch '\\(bin|obj|\.git)\\' } |
            Select-String -Pattern $patterns -SimpleMatch |
            ForEach-Object { "{0}:{1}: {2}" -f $_.Path.Substring($PWD.Path.Length + 1), $_.LineNumber, $_.Line.Trim() }
