name: ChartKit Verification

on:
  pull_request:
    branches:
      - main
      - improve/chart-engine-hardening
  push:
    branches:
      - improve/chart-engine-hardening
      - refactor/p1-solution-split
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-Includes([xml]$project, [string]$itemName) {
            $includes = @()
            foreach ($group in @($project.Project.ItemGroup)) {
              foreach ($item in @($group.$itemName)) {
                if ($null -eq $item) { continue }
                $include = [string]$item.Include
                if (-not [string]::IsNullOrWhiteSpace($include)) {
                  $includes += $include
                }
              }
            }
            return $includes
          }

          [xml]$demo = Get-Content .\ChartKit.vbproj -Raw
          [xml]$core = Get-Content .\src\ChartKit.Core\ChartKit.Core.vbproj -Raw
          [xml]$data = Get-Content .\src\ChartKit.DataSources\ChartKit.DataSources.vbproj -Raw

          $demoCompile = @(Get-Includes $demo 'Compile')
          $expectedDemoCompile = @('DemoProgram.vb', 'UI\**\*.vb')
          if ($demoCompile.Count -ne $expectedDemoCompile.Count -or
              @($expectedDemoCompile | Where-Object { $_ -notin $demoCompile }).Count -gt 0) {
            throw "ChartKit demo compile boundary mismatch: $($demoCompile -join ', ')"
          }

          $demoRefs = @(Get-Includes $demo 'ProjectReference')
          $expectedDemoRefs = @(
            'src\ChartKit.Core\ChartKit.Core.vbproj',
            'src\ChartKit.DataSources\ChartKit.DataSources.vbproj'
          )
          if ($demoRefs.Count -ne $expectedDemoRefs.Count -or
              @($expectedDemoRefs | Where-Object { $_ -notin $demoRefs }).Count -gt 0) {
            throw "ChartKit demo references mismatch: $($demoRefs -join ', ')"
          }

          $coreCompile = @(Get-Includes $core 'Compile')
          foreach ($required in @(
            '..\..\Abstractions\**\*.vb',
            '..\..\Models\**\*.vb',
            '..\..\Indicators\**\*.vb',
            '..\..\Core\**\*.vb',
            '..\..\Layers\**\*.vb')) {
            if ($required -notin $coreCompile) {
              throw "ChartKit.Core missing compile boundary: $required"
            }
          }
          if (@(Get-Includes $core 'ProjectReference').Count -gt 0) {
            throw 'ChartKit.Core must not reference higher-level projects.'
          }

          $dataCompile = @(Get-Includes $data 'Compile')
          if ($dataCompile.Count -ne 1 -or $dataCompile[0] -ne '..\..\DataSources\**\*.vb') {
            throw "ChartKit.DataSources compile boundary mismatch: $($dataCompile -join ', ')"
          }
          $dataRefs = @(Get-Includes $data 'ProjectReference')
          if ($dataRefs.Count -ne 1 -or $dataRefs[0] -ne '..\ChartKit.Core\ChartKit.Core.vbproj') {
            throw "ChartKit.DataSources reference mismatch: $($dataRefs -join ', ')"
          }

          Write-Host 'project_split_verification=PASS'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\ChartKit.sln

      - name: Build Release
        run: dotnet build .\ChartKit.sln -c Release --no-restore

      - name: Verify realtime FIFO
        run: dotnet run --project .\Tests\RealtimeFifoVerification\VerifyRealtimeFifo.vbproj -c Release --no-build

      - name: Verify candle time causality
        run: dotnet run --project .\Tests\CandleTimeVerification\VerifyCandleTime.vbproj -c Release --no-build

      - name: Verify tick aggregation stability
        run: dotnet run --project .\Tests\TickAggregationVerification\VerifyTickAggregation.vbproj -c Release --no-build

      - name: Verify panel layout immutability
        run: dotnet run --project .\Tests\PanelLayoutVerification\VerifyPanelLayout.vbproj -c Release --no-build

      - name: Verify indicator identity
        run: dotnet run --project .\Tests\IndicatorIdentityVerification\VerifyIndicatorIdentity.vbproj -c Release --no-build

      - name: Verify incremental equivalence
        run: dotnet run --project .\Tests\IncrementalEquivalenceVerification\VerifyIncrementalEquivalence.vbproj -c Release --no-build

      - name: Verify rendering allocation bounds
        run: dotnet run --project .\Tests\RenderingAllocationVerification\VerifyRenderingAllocation.vbproj -c Release --no-build

      - name: Verify Kiwoom session coordination
        run: dotnet run --project .\Tests\KiwoomSessionVerification\VerifyKiwoomSession.vbproj -c Release --no-build
