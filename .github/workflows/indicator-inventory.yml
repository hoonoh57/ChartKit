name: Indicator Identity Inventory

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inventory:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect indicator inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path inventory | Out-Null
          Get-ChildItem -Recurse -File -Filter *.vb |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } |
            Select-Object -ExpandProperty FullName |
            Sort-Object |
            Set-Content -Encoding utf8 inventory/all-vb-files.txt

          $patterns = @(
            'Interface IIndicator',
            'Class IndicatorEngine',
            'ReadOnly Property Name',
            'Function Name',
            '\.Name',
            'Results.TryGetValue',
            'Results\(',
            'Dictionary\(Of String'
          )

          Get-ChildItem -Recurse -File -Filter *.vb |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } |
            Select-String -Pattern $patterns -AllMatches |
            ForEach-Object {
              '{0}:{1}: {2}' -f $_.Path, $_.LineNumber, $_.Line.Trim()
            } |
            Set-Content -Encoding utf8 inventory/indicator-references.txt

          $candidateFiles = Get-ChildItem -Recurse -File -Filter *.vb |
            Where-Object {
              $_.FullName -notmatch '\\(bin|obj)\\' -and
              (Select-String -LiteralPath $_.FullName -Pattern 'Interface IIndicator|Class IndicatorEngine|Implements IIndicator|ReadOnly Property Name' -Quiet)
            }

          foreach ($file in $candidateFiles) {
            $relative = $file.FullName.Substring($PWD.Path.Length + 1).Replace('\', '__')
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path inventory $relative)
          }

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: indicator-identity-inventory
          path: inventory
          if-no-files-found: error
